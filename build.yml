name: Build Minecraft Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        run: |
          echo "Checking for gradlew..."
          if [ ! -f "gradlew" ]; then echo "Error: gradlew file not found in root!"; exit 1; fi
          echo "Checking for gradle-wrapper.jar..."
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then echo "Error: gradle-wrapper.jar not found in gradle/wrapper/!"; exit 1; fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-Build
          path: build/libs/*.jar
